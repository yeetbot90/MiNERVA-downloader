name: Release Build (Windows Portable + Linux AppImage)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bump_version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version and create tag
        id: version
        run: |
          new_tag=$(npm version ${{ inputs.bump }} -m "chore(release): %s")
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          git push --follow-tags

  build:
    needs: [bump_version]
    if: github.event_name == 'push' || needs.bump_version.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_DIR: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Linux launch test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libnss3 libxss1 libasound2t64

      - name: Build single-file executable
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run build:win:portable
          else
            npm run build:linux
          fi
          mapfile -t executables < <(find "${{ env.RELEASE_DIR }}" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.exe' \) -print)
          if [ "${#executables[@]}" -ne 1 ]; then
            echo "Expected exactly one single-file executable artifact, found ${#executables[@]}:" >&2
            find "${{ env.RELEASE_DIR }}" -maxdepth 2 -type f -print >&2
            exit 1
          fi
          exec_name=$(basename "${executables[0]}")
          echo "ARTIFACT_NAME=$exec_name" >> "$GITHUB_ENV"
          echo "FILENAME=${executables[0]}" >> "$GITHUB_ENV"

      - name: Smoke test executable launch
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -Command "\$p = Start-Process -FilePath \$env:FILENAME -PassThru; Start-Sleep -Seconds 10; if (\$p.HasExited) { exit \$p.ExitCode }; Stop-Process -Id \$p.Id -Force"
          else
            chmod +x "$FILENAME"
            status=0
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 20s "$FILENAME" --no-sandbox || status=$?
            if [ "$status" != "0" ] && [ "$status" != "124" ]; then
              exit "$status"
            fi
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.FILENAME }}
          compression-level: 9

  publish_release:
    needs: [build, bump_version]
    if: github.event_name == 'push' || needs.bump_version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.bump_version.outputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG_NAME" --repo "$REPOSITORY" --title "$TAG_NAME" --notes "Automated release for $TAG_NAME"
          gh release upload "$TAG_NAME" dist-artifacts/* --repo "$REPOSITORY" --clobber
